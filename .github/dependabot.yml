# Dependency යාවත්කාලීන කිරීම් ස්වයංක්‍රීයව PR ලෙස (සතිපතා). Security patches වහාම PR ලෙස ලැබේ (GitHub Security settings තුළ Dependabot alerts සක්‍රිය කරන්න)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
